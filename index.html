<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Integration Calculator</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/function-plot@1.22.8/dist/function-plot.js"></script>

    <style>
        :root {
            --primary-color: #4A90E2;
            --bg-color: #f5f7fa;
            --sidebar-width: 380px;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            overflow: hidden;
        }

        /* Sidebar styling similar to Desmos panel */
        #sidebar {
            width: var(--sidebar-width);
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.5rem;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e4e8;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .limits-row {
            display: flex;
            gap: 15px;
        }

        .limits-row .input-group {
            flex: 1;
        }

        /* Result Panel */
        #result-container {
            margin-top: 20px;
            padding: 20px;
            background: #eef5fc;
            border-left: 5px solid var(--primary-color);
            border-radius: 4px;
        }

        .integral-symbol {
            font-size: 1.8rem;
            font-family: "Times New Roman", Times, serif;
            font-style: italic;
            vertical-align: middle;
        }

        #result-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 10px;
            word-break: break-all;
        }

        .error {
            color: #de3545;
            background: #fbebebc3;
            border-left: 5px solid #de3545;
            padding: 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }

        /* Graphing area canvas */
        #graph-container {
            flex: 1;
            position: relative;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #plot {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Definite Integral</h2>
        
        <div class="input-group">
            <label for="function-input">Function f(x)</label>
            <input type="text" id="function-input" value="x^2 - 2x" placeholder="e.g., sin(x), x^2, 3*x + 1">
        </div>

        <div class="limits-row">
            <div class="input-group">
                <label for="limit-a">Lower Limit (a)</label>
                <input type="number" id="limit-a" value="0" step="any">
            </div>
            <div class="input-group">
                <label for="limit-b">Upper Limit (b)</label>
                <input type="number" id="limit-b" value="3" step="any">
            </div>
        </div>

        <div id="result-container">
            <div><span class="integral-symbol">∫</span><sub>a</sub><sup>b</sup> f(x) dx =</div>
            <div id="result-value">0</div>
        </div>

        <div id="error-message" class="error"></div>
    </div>

    <div id="graph-container">
        <div id="plot"></div>
    </div>

    <script>
        // Setup references to UI Elements
        const funcInput = document.getElementById('function-input');
        const limitAInput = document.getElementById('limit-a');
        const limitBInput = document.getElementById('limit-b');
        const resultValue = document.getElementById('result-value');
        const errorMessage = document.getElementById('error-message');

        // Numeric Integration using Simpson's Rule 
        function integrate(f, a, b, n = 1000) {
            // Ensure n is even for Simpson's rule
            if (n % 2 !== 0) n++; 
            
            const h = (b - a) / n;
            let sum = f(a) + f(b);

            for (let i = 1; i < n; i++) {
                const x = a + i * h;
                sum += f(x) * (i % 2 === 0 ? 2 : 4);
            }

            return (h / 3) * sum;
        }

        // Main Calculation and Render Function
        function update() {
            const exprString = funcInput.value.trim();
            const a = parseFloat(limitAInput.value);
            const b = parseFloat(limitBInput.value);

            // Reset Error Display
            errorMessage.style.display = 'none';

            if (!exprString || isNaN(a) || isNaN(b)) {
                resultValue.textContent = "—";
                return;
            }

            try {
                // Compile the user math string using Math.js
                const compiledExpr = math.compile(exprString);
                
                // Formulate a native JS function helper for evaluating x
                const f = (xVal) => compiledExpr.evaluate({ x: xVal });

                // Test-run function evaluation to verify stability
                f(a);

                // Calculate the definite integral
                let result = integrate(f, a, b);
                
                // Format decimal output nicely
                if (Math.abs(result) < 1e-10) result = 0;
                resultValue.textContent = Number(result.toFixed(5));

                // Redraw the graph with the calculated inputs
                drawGraph(exprString, a, b);

            } catch (err) {
                // Catch math syntax or evaluation issues safely
                errorMessage.textContent = "Error parsing expression. Make sure to use explicit operators (e.g., 2*x instead of 2x).";
                errorMessage.style.display = 'block';
                resultValue.textContent = "Error";
            }
        }

        // Render Graph Canvas via function-plot library
        function drawGraph(expr, a, b) {
            const width = document.getElementById('graph-container').offsetWidth;
            const height = document.getElementById('graph-container').offsetHeight;

            // Generate an automatic comfortable viewing window boundary around bounds [a, b]
            const xMin = Math.min(a, b) - 2;
            const xMax = Math.max(a, b) + 2;

            functionPlot({
                target: '#plot',
                width: width,
                height: height,
                grid: true,
                xAxis: { domain: [xMin, xMax] },
                yAxis: { domain: [-5, 10] }, // Scaled dynamically by the library context
                data: [
                    {
                        // Plot the core function curve line
                        fn: expr,
                        graphType: 'polyline',
                        color: '#4A90E2'
                    },
                    {
                        // Generate shaded integral integration area
                        fn: expr,
                        desc: 'Integral Area Shading',
                        color: 'rgba(74, 144, 226, 0.25)',
                        closed: true, // Closes path line tightly back down into the X-axis
                        range: [Math.min(a, b), Math.max(a, b)],
                        graphType: 'polyline'
                    }
                ]
            });
        }

        // Attach interactive keystroke and input triggers
        [funcInput, limitAInput, limitBInput].forEach(element => {
            element.addEventListener('input', update);
        });

        // Trigger dynamic graph resizing if layout view dimensions change
        window.addEventListener('resize', update);

        // Run initial default compilation loop on app boot
        update();
    </script>
</body>
</html>
